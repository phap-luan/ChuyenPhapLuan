<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đọc Sách Cổ Điển - Dàn Trang Chuẩn</title>
    <style>
        :root {
            --bg-color: #2b1e16;
            --paper-bg: #f4ecd8;
            --paper-pattern: #ebdcb9;
            --border-color: #8c2d19;
            --color-even: #1d5c2b; /* Xanh lá cho câu chẵn */
            --color-odd: #9e2a2b;  /* Đỏ / Nâu cho câu lẻ */
            --text-pinyin: #664422;
            --bg-hover: rgba(140, 45, 25, 0.12);
            --top-bar-height: 52px;
            --bottom-bar-height: 52px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Kaiti SC", "STKaiti", "KaiTi", "SimKai", "DFKai-SB", "Noto Serif CJK SC", serif;
            background-color: var(--bg-color);
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        /* Top Bar Navigation - Gắn cố định ở trên & Căn giữa controls */
        .top-nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: var(--top-bar-height);
            background: #4a1f18;
            color: #e6c594;
            padding: 0 15px;
            display: flex;
            justify-content: center; /* Căn giữa controls */
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            border-bottom: 1px solid #7a3528;
            z-index: 100;
        }

        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        button, select {
            background: #e6c594;
            color: #3a1700;
            border: 1px solid #8c4a27;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            transition: all 0.2s;
            height: 36px;
        }

        button:hover, select:hover {
            background: #fff0d4;
            box-shadow: 0 0 5px rgba(230, 197, 148, 0.5);
        }

        /* Custom Dropdown Chois Phần */
        .phan-dropdown-container {
            position: relative;
            display: inline-block;
        }

        .btn-phan-select {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            min-width: 140px;
            background: #e6c594;
            border: 1px solid #8c4a27;
            color: #3a1700;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Menu danh sách các Phần xổ xuống */
        .phan-list-menu {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            margin-top: 5px;
            width: 260px;
            max-height: 350px;
            overflow-y: auto;
            background: #ffffff;
            border: 2px solid #8c2d19;
            border-radius: 6px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            z-index: 2000;
            direction: ltr; /* Hiển thị văn bản xuôi */
        }

        .phan-list-menu.show {
            display: block;
        }

        /* Item 2 dòng */
        .phan-item {
            padding: 8px 12px;
            cursor: pointer;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
            gap: 2px;
            transition: background-color 0.2s;
        }

        /* Khung lẻ màu trắng, khung chẵn màu xám nhạt */
        .phan-item:nth-child(odd) {
            background-color: #ffffff;
        }
        .phan-item:nth-child(even) {
            background-color: #f2f2f2;
        }

        .phan-item:hover {
            background-color: #e6c594 !important;
        }

        .phan-item-hanzi {
            font-family: "Kaiti SC", "STKaiti", "KaiTi", "SimKai", serif;
            font-size: 16px;
            font-weight: bold;
            color: #8c2d19;
        }

        .phan-item-viet {
            font-family: Arial, sans-serif;
            font-size: 13px;
            color: #444444;
        }

        .page-info {
            font-size: 14px;
            font-weight: bold;
            color: #e6c594;
            margin: 0 10px;
        }

        /* Bottom Pagination Controls */
        .bottom-pagination {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100vw;
            height: var(--bottom-bar-height);
            background: #4a1f18;
            border-top: 1px solid #7a3528;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            z-index: 100;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.5);
        }

        /* Main Container */
        .book-wrapper {
            position: relative;
            margin-top: var(--top-bar-height);
            height: calc(100dvh - var(--top-bar-height) - var(--bottom-bar-height));
            background-color: var(--paper-bg);
            background-image: radial-gradient(var(--paper-pattern) 1px, transparent 0);
            background-size: 20px 20px;
            border: 8px solid #5c2419;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.3), 0 10px 25px rgba(0,0,0,0.8);
            border-radius: 0;
            padding: 8px 16px 16px 16px; 
            display: flex;
            justify-content: flex-start;
            align-items: flex-start;
            width: 100vw;
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
            direction: rtl;
        }

        .book-frame {
            border: 2px solid var(--border-color);
            padding: 4px;
            display: inline-block;
            background-color: rgba(255, 255, 255, 0.2);
            height: 100%;
            max-height: 100%;
            overflow-y: auto; 
            max-width: none;
            flex-shrink: 0;
            margin: 0 auto;
            box-sizing: border-box;
        }

        /* Classical Grid - Vertical Writing */
        .page-grid {
            display: grid;
            grid-auto-flow: column;
            grid-template-rows: repeat(43, auto);
            direction: rtl;
            border-top: 2px solid var(--border-color);
            border-bottom: 2px solid var(--border-color);
        }

        .grid-normal  { grid-template-columns: repeat(13, minmax(38px, max-content)); }
        .grid-title-1 { grid-template-columns: minmax(76px, max-content) repeat(11, minmax(38px, max-content)); }
        .grid-title-2 { grid-template-columns: minmax(76px, max-content) minmax(76px, max-content) repeat(9, minmax(38px, max-content)); }

        .title-col {
            grid-row: 1 / -1;
            writing-mode: vertical-rl;
            text-orientation: upright;
            border-left: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            background-color: rgba(140, 45, 25, 0.05);
            font-weight: bold;
            color: #2b1e16;
            display: block !important;
            text-align: left !important;
            padding-top: 15px !important;
            box-sizing: border-box;
        }

        .title-col-1 {
            font-size: 40px;
            letter-spacing: 6px;
            padding-right: 18px !important;
        }

        .title-col-2 {
            font-size: 35px;
            letter-spacing: 4px;
            padding-right: 20px !important;
        }

        .cell {
            direction: ltr;
            border-left: 1px solid rgba(140, 45, 25, 0.3);
            border-bottom: 1px solid transparent;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0px 1px;
            cursor: pointer;
            transition: background-color 0.15s;
            position: relative;
            min-height: 28px;
        }

        .cell:hover {
            background-color: var(--bg-hover);
        }

        .cell-even { color: var(--color-even); }
        .cell-odd { color: var(--color-odd); }

        .cell-hanzi {
            font-size: 35px;
            line-height: 1.1;
        }

        .cell-punctuation .cell-hanzi {
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
            width: 100%;
            height: 100%;
            transform: translateX(10px) translateY(-16px) !important;
        }

        .cell-pinyin {
            font-size: 11px;
            font-family: Arial, sans-serif;
            color: var(--text-pinyin);
            line-height: 1;
            display: none;
            text-align: center;
            margin-top: 1px;
            white-space: nowrap;
        }

        .show-pinyin .cell-pinyin { 
            display: block; 
        }

        .empty-cell {
            border-left: 1px solid rgba(140, 45, 25, 0.3);
            border-bottom: 0px solid transparent;
            min-height: 28px;
        }

        /* Modal Explanations & TXT Content */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.75);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background: var(--paper-bg);
            border: 4px solid #5c2419;
            width: 90%;
            max-width: 650px;
            max-height: 80vh;
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        .modal-header {
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 18px;
            color: #5c2419;
            font-weight: bold;
        }

        .modal-close {
            background: var(--border-color);
            color: white;
            border: none;
            padding: 4px 10px;
            cursor: pointer;
            border-radius: 3px;
        }

        .modal-content {
            overflow-y: auto;
            font-size: 15px;
            line-height: 1.6;
            color: #222;
        }
    </style>

    <script src="popup.js"></script>
</head>
<body>

    <!-- Top Bar Navigation (Gắn cố định ở top & Căn giữa) -->
    <div class="top-nav" id="topNav">
        <div class="controls">
            <!-- Chọn Bài -->
            <select id="selectBai">
                <option value="01">第一講</option>
                <option value="02">第二講</option>
                <option value="03">第三講</option>
                <option value="04">第四講</option>
                <option value="05">第五講</option>
                <option value="06">第六講</option>
                <option value="07">第七講</option>
                <option value="08">第八講</option>
                <option value="09">第九講</option>
            </select>

            <!-- Custom Select Box Chois Phần -->
            <div class="phan-dropdown-container">
                <button type="button" class="btn-phan-select" id="btnPhanToggle">
                    <span id="currentPhanLabel">Phần 1</span> ▼
                </button>
                <div class="phan-list-menu" id="phanListMenu">
                    <!-- Danh sách các phần sẽ được Render tự động ở đây -->
                </div>
            </div>

            <!-- Nút Toggle Pinyin -->
            <button id="togglePinyinBtn">🔤 Pinyin: ẨN</button>
        </div>
    </div>

    <!-- Main Book Frame -->
    <div class="book-wrapper" id="bookWrapper">
        <div class="book-frame">
            <div id="pageGrid" class="page-grid grid-title-2">
                <!-- Nội dung sách -->
            </div>
        </div>
    </div>

    <!-- Bottom Pagination Controls -->
    <div class="bottom-pagination" id="bottomNav">
        <button id="btnPrevPage">◀ Trang Trước</button>
        <span class="page-info" id="pageDisplay">Trang 1 / 1</span>
        <button id="btnNextPage">Trang Sau ▶</button>
    </div>

    <!-- Modal Popup -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <div class="modal-header">
                <div class="modal-title" id="modalTitle">Phân Tích Chi Tiết Câu</div>
                <button class="modal-close" id="modalCloseBtn">✕ Đóng</button>
            </div>
            <div class="modal-content" id="modalContent">
                Đang tải dữ liệu...
            </div>
        </div>
    </div>

    <script>
        // CẤU TRÚC DANH SÁCH TÊN PHẦN THEO TỪNG BÀI (Chỉnh sửa danh sách ở đây)
       // CẤU TRÚC DANH SÁCH TÊN PHẦN THEO TỪNG BÀI
const DANH_SACH_PHAN = {
    "01": [
        { id: 1, hanzi: "真正往高層次上帶人", viet: "1.Chân Bổn Luận" },
        { id: 2, hanzi: "不同層次有不同層次的法", viet: "2.Khí Công Và Thể Dục" },
        { id: 3, hanzi: "真、善、忍是衡量好壞人的唯一標準", viet: "Phần 3: Khí Công Và Ý Niệm" },
        { id: 4, hanzi: "氣功是史前文化", viet: "Phần 4: Thần Tiên Truyền" }
    ],
    "02": [
        { id: 1, hanzi: "第一節：陰陽學說", viet: "Phần 1: Học Thuyết Âm Dương" },
        { id: 2, hanzi: "第二節：五行生克", viet: "Phần 2: Ngũ Hành Sinh Khắc" },
        { id: 3, hanzi: "第三節：臟腑經絡", viet: "Phần 3: Tạng Phủ Kinh Lạc" }
    ],
    "03": [
        { id: 1, hanzi: "第一節：修心養性", viet: "Phần 1: Tu Tâm Dưỡng Tánh" },
        { id: 2, hanzi: "第二節：天人合一", viet: "Phần 2: Thiên Nhân Hợp Nhất" }
    ]
    // Bạn cứ tiếp tục điền đủ 60 phần vào đây theo dạng "01", "02",... "09"
};

let currentPhanData = null;
let generatedPages = [];
let currentPageIdx = 0;
let showPinyin = false;
let selectedPhanId = 1;

const ROWS_PER_COL = 43;

const pageGrid = document.getElementById('pageGrid');
const togglePinyinBtn = document.getElementById('togglePinyinBtn');
const selectBai = document.getElementById('selectBai');

const btnPhanToggle = document.getElementById('btnPhanToggle');
const currentPhanLabel = document.getElementById('currentPhanLabel');
const phanListMenu = document.getElementById('phanListMenu');

const btnPrevPage = document.getElementById('btnPrevPage');
const btnNextPage = document.getElementById('btnNextPage');
const pageDisplay = document.getElementById('pageDisplay');

// Hàm Cập nhật danh sách các Phần vào Menu xổ xuống
function updatePhanDropdownList(baiValue) {
    phanListMenu.innerHTML = '';
    
    // Lấy danh sách phần của bài hiện tại
    const list = DANH_SACH_PHAN[baiValue] || [
        { id: 1, hanzi: "第一節：內容", viet: "Phần 1: Nội dung" }
    ];

    list.forEach(item => {
        const div = document.createElement('div');
        div.className = 'phan-item';
        div.innerHTML = `
            <div class="phan-item-hanzi">${item.hanzi}</div>
            <div class="phan-item-viet">${item.viet}</div>
        `;
        
        // Sự kiện khi bấm chọn 1 phần
        div.addEventListener('click', (e) => {
            e.stopPropagation();
            selectedPhanId = item.id;
            
            // HIỂN THỊ TÊN CHỮ HÁN LÊN NÚT BẤM KHI CHỌN
            currentPhanLabel.textContent = item.hanzi;
            
            phanListMenu.classList.remove('show');
            
            // Tải dữ liệu phần được chọn ngay lập tức
            loadPhanScript(selectBai.value, selectedPhanId);
        });

        phanListMenu.appendChild(div);
    });

    // Cập nhật nhãn nút bấm mặc định là chữ Hán của Phần 1 khi tải/đổi Bài
    if (list.length > 0) {
        currentPhanLabel.textContent = list[0].hanzi;
    }
}

// Bật/tắt menu xổ xuống
btnPhanToggle.addEventListener('click', (e) => {
    e.stopPropagation();
    phanListMenu.classList.toggle('show');
});

// Ẩn dropdown khi click bên ngoài
document.addEventListener('click', () => {
    phanListMenu.classList.remove('show');
});

// Khi thay đổi Bài -> Cập nhật danh sách Phần và tự động tải Phần 1
selectBai.addEventListener('change', () => {
    selectedPhanId = 1;
    updatePhanDropdownList(selectBai.value);
    loadPhanScript(selectBai.value, 1);
});

function loadPhanScript(bai, phan) {
    const baiStr = String(bai).padStart(2, '0');
    const phanStr = String(phan).padStart(2, '0');
    const scriptPath = `data/bai_${baiStr}/phan_${phanStr}/data.js`;

    const oldScript = document.getElementById('dynamic-data-script');
    if (oldScript) oldScript.remove();

    const script = document.createElement('script');
    script.id = 'dynamic-data-script';
    script.src = scriptPath;

    script.onload = () => {
        if (window.CURRENT_PHAN_DATA) {
            currentPhanData = window.CURRENT_PHAN_DATA;
            processBookPagination();
        } else {
            alert(`Không tìm thấy dữ liệu hợp lệ trong file: ${scriptPath}`);
        }
    };

    script.onerror = () => {
        alert(`Không thể tải: ${scriptPath}\nVui lòng kiểm tra lại cấu trúc thư mục data/`);
    };

    document.head.appendChild(script);
}

function processBookPagination() {
    if (!currentPhanData || !currentPhanData.doan_list) return;

    generatedPages = [];
    let currentPage = [];
    let currentColCount = 0;
    let currentCellInCol = 0;

    const meta = currentPhanData.meta || {};
    const t1 = meta.tieude1 || '';
    const t2 = meta.tieude2 || '';

    let maxColsPage1 = 13;
    if (t1 && t2) maxColsPage1 = 9;
    else if (t1) maxColsPage1 = 11;

    let maxColsCurrentPage = maxColsPage1;

    currentPhanData.doan_list.forEach((doan) => {
        if (currentCellInCol > 0) {
            while (currentCellInCol < ROWS_PER_COL) {
                currentPage.push({ type: 'empty' });
                currentCellInCol++;
            }
            currentCellInCol = 0;
            currentColCount++;
        }

        if (currentColCount >= maxColsCurrentPage) {
            generatedPages.push(currentPage);
            currentPage = [];
            currentColCount = 0;
            maxColsCurrentPage = 13;
        }

        if (doan.content && Array.isArray(doan.content)) {
            doan.content.forEach((sentence, sIdx) => {
                const hanziChars = sentence.hanzi ? sentence.hanzi.split('') : [];
                const pinyinList = sentence.pinyin ? sentence.pinyin.trim().split(/\s+/) : [];
                let pinyinIdx = 0;

                hanziChars.forEach((char) => {
                    let pinyinVal = '';
                    if (/[\u4e00-\u9fa5]/.test(char) && pinyinIdx < pinyinList.length) {
                        pinyinVal = pinyinList[pinyinIdx];
                        pinyinIdx++;
                    }

                    currentPage.push({
                        type: 'char',
                        char: char,
                        pinyin: pinyinVal,
                        sentence: sentence,
                        sentenceIdx: sIdx
                    });

                    currentCellInCol++;

                    if (currentCellInCol >= ROWS_PER_COL) {
                        currentCellInCol = 0;
                        currentColCount++;

                        if (currentColCount >= maxColsCurrentPage) {
                            generatedPages.push(currentPage);
                            currentPage = [];
                            currentColCount = 0;
                            maxColsCurrentPage = 13;
                        }
                    }
                });
            });
        }
    });

    if (currentPage.length > 0) {
        while (currentPage.length % ROWS_PER_COL !== 0) {
            currentPage.push({ type: 'empty' });
        }
        generatedPages.push(currentPage);
    }

    currentPageIdx = 0;
    renderPage(currentPageIdx);
}

function renderPage(pageIdx) {
    if (generatedPages.length === 0) return;

    pageGrid.innerHTML = '';
    const pageData = generatedPages[pageIdx];
    const meta = currentPhanData.meta || {};

    const t1 = meta.tieude1 || '';
    const t2 = meta.tieude2 || '';

    if (pageIdx === 0) {
        if (t1 && t2) {
            pageGrid.className = "page-grid grid-title-2";
        } else if (t1) {
            pageGrid.className = "page-grid grid-title-1";
        } else {
            pageGrid.className = "page-grid grid-normal";
        }

        if (t1) {
            const titleCol1 = document.createElement('div');
            titleCol1.className = 'title-col title-col-1'; 
            titleCol1.textContent = t1;
            pageGrid.appendChild(titleCol1);
        }

        if (t2) {
            const titleCol2 = document.createElement('div');
            titleCol2.className = 'title-col title-col-2'; 
            titleCol2.textContent = t2;
            pageGrid.appendChild(titleCol2);
        }
    } else {
        pageGrid.className = "page-grid grid-normal";
    }

    if (showPinyin) pageGrid.classList.add('show-pinyin');

    pageData.forEach((cellData) => {
        if (cellData.type === 'empty') {
            const emptyCell = document.createElement('div');
            emptyCell.className = 'empty-cell';
            pageGrid.appendChild(emptyCell);
        } else if (cellData.type === 'char') {
            const cell = document.createElement('div');
            const colorClass = (cellData.sentenceIdx % 2 === 0) ? 'cell-even' : 'cell-odd';
            cell.className = `cell ${colorClass}`;

            const isPunctuation = /^[，。、、，,.\s《》""''“”‘’]+$/.test(cellData.char);
            if (isPunctuation) {
                cell.classList.add('cell-punctuation');
            }

            const hanziDiv = document.createElement('div');
            hanziDiv.className = 'cell-hanzi';
            hanziDiv.textContent = cellData.char;

            const pinyinDiv = document.createElement('div');
            pinyinDiv.className = 'cell-pinyin';
            pinyinDiv.textContent = cellData.pinyin;

            cell.appendChild(hanziDiv);
            cell.appendChild(pinyinDiv);

            cell.addEventListener('click', () => {
                if (typeof openExplanation === 'function') {
                    openExplanation(cellData.sentence);
                }
            });

            pageGrid.appendChild(cell);
        }
    });

    pageDisplay.textContent = `Trang ${pageIdx + 1} / ${generatedPages.length}`;
    
    // Tự động cuộn về bên phải khi mở trang
    setTimeout(() => {
        const bookWrapper = document.getElementById('bookWrapper');
        if (bookWrapper) {
            bookWrapper.scrollLeft = bookWrapper.scrollWidth;
        }
    }, 50);
}

btnPrevPage.addEventListener('click', () => {
    if (currentPageIdx > 0) {
        currentPageIdx--;
        renderPage(currentPageIdx);
    }
});

btnNextPage.addEventListener('click', () => {
    if (currentPageIdx < generatedPages.length - 1) {
        currentPageIdx++;
        renderPage(currentPageIdx);
    }
});

togglePinyinBtn.addEventListener('click', () => {
    showPinyin = !showPinyin;
    pageGrid.classList.toggle('show-pinyin', showPinyin);
    togglePinyinBtn.textContent = showPinyin ? "🔤 Pinyin: HIỆN" : "🔤 Pinyin: ẨN";
});

window.addEventListener('DOMContentLoaded', () => {
    updatePhanDropdownList('01');
    loadPhanScript(1, 1);
});
    </script>
</body>
</html>
